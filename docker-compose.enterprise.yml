version: '3.8'

services:
  oracledb:
    image: container-registry.oracle.com/database/free:latest
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PWD=readonly_password
    volumes:
      - oracledata:/opt/oracle/oradata

  db2:
    image: icr.io/db2_community/db2
    ports:
      - "50000:50000"
    environment:
      - DB2INST1_PASSWORD=readonly_password
      - LICENSE=accept
    privileged: true
    volumes:
      - db2data:/database

volumes:
  oracledata:
  db2data:
